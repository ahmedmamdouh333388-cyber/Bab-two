<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة</title>
    <!-- خط عربي عصري من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome للواتس آب -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            font-size: 50px;
            color: #38bdf8;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        /* تنسيق اسم المطور */
        .developer-name {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* تنسيق عداد الوقت */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .time-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 10px;
            border-radius: 12px;
            min-width: 70px;
        }

        .time-box span {
            display: block;
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }

        .time-box label {
            font-size: 12px;
            color: #64748b;
        }

        /* شريط التقدم */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            width: 100%;
            transition: width 1s linear;
        }

        /* زر الواتساب */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25d366;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .whatsapp-btn:hover {
            background-color: #22bf5b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-btn i {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-gears"></i>
        </div>
        <h1>تم إيقاف الموقع بواسطة المطور</h1>
        <div class="developer-name">Ahmed Mamdouh</div>
        <p>نقوم حالياً بإجراء بعض التحديثات والصيانة لتحسين تجربة استخدامك. سيتم إعادة تشغيل الموقع تلقائياً بمجرد انتهاء الوقت أدناه.</p>

        <!-- عداد الوقت -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>أيام</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>ساعات</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>دقائق</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>ثواني</label>
            </div>
        </div>

        <!-- شريط التقدم الزمني -->
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- زر التواصل مع المطور -->
        <a href="https://wa.me/201225428692" target="_blank" class="whatsapp-btn">
            <i class="fa-brands fa-whatsapp"></i> تواصل مع المطور
        </a>
    </div>

    <script>
        // تحديد وقت بداية الصيانة ووقت نهايتها الثابت ليكون موحداً على كل الأجهزة
        // وقت البداية: 12 أكتوبر 2026
        const startTime = new Date("2026-10-12T00:00:00").getTime();
        // وقت النهاية الثابت: بعد 7 أيام بالضبط (19 أكتوبر 2026)
        const endTime = new Date("2026-10-19T00:00:00").getTime();
        
        const totalDurationMs = endTime - startTime;

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = endTime - now;

            if (timeLeft <= 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.getElementById("progressBar").style.width = "0%";
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            // حساب نسبة شريط التقدم بناءً على الوقت المتبقي من الـ 7 أيام الثابتة
            let progressPercentage = (timeLeft / totalDurationMs) * 100;
            if (progressPercentage > 100) progressPercentage = 100;
            if (progressPercentage < 0) progressPercentage = 0;
            
            document.getElementById("progressBar").style.width = progressPercentage + "%";
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
