<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع قيد الصيانة والتحسين</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(56, 189, 248, 0.3);
            --primary-accent: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* كرة نيون خلفية جمالية */
        .glow-sphere {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* كارت الصيانة الزجاجي */
        .maintenance-card {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .icon-container {
            font-size: 3.5rem;
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        h1 {
            font-size: 1.6rem;
            color: var(--text-color);
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* شريط حالة التقدم */
        .progress-bar-container {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            height: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-bar {
            width: 70%; /* يمكنك تغيير نسبة الإنجاز من هنا */
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        /* معلومات التواصل والتوقيع */
        .footer-info {
            border-top: 1px dashed var(--border-color);
            padding-top: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .creator {
            color: var(--primary-accent);
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        .wa-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease;
        }

        .wa-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>

    <div class="maintenance-card">
        <div class="icon-container">🧪🛠️</div>
        <h1>منصة التحليل الكيميائي</h1>
        <p>نعمل حالياً على تحديث المنصة وإضافة تحسينات جديدة لتوفير أفضل تجربة تعليمية. سنعود قريباً جداً!</p>

        <!-- نسبة الإنجاز -->
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <div class="footer-info">
            <span>جاري تجهيز التحديثات بواسطة</span>
            <span class="creator">Ahmed Mamdouh</span>
            
            <a href="https://wa.me/201225428692" target="_blank" class="wa-btn">
                <span>💬 للتواصل المباشر عبر الواتساب</span>
            </a>
        </div>
    </div>

</body>
</html>
